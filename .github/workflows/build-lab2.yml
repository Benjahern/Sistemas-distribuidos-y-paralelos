name: Unit tests - Build - Lab2

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "Lab2/**"
      - ".github/workflows/build-lab2.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "Lab2/**"
      - ".github/workflows/build-lab2.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilacion y ejecucion de test (Lab2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./Lab2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-numpy python3-matplotlib

      - name: Compile and run full test suite
        run: make test

      - name: Run Sobel panel demo and generate figures
        run: |
          make demo
          make plots

